name: Ultimate AI Update Manager (Astro + TG)

on:
  push:
    paths:
      - 'ai-updates/**.zip'

jobs:
  unzip-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm install

      # Головний сценарій: фото → staging → тестова збірка →
      # (при успіху) перенесення у реальний репозиторій →
      # два повідомлення в Telegram → видалення ZIP.
      # Детальний опис кроків — усередині scripts/process-update.js.
      - name: Process update (photos, staging build, promote)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: node scripts/process-update.js

      # Рахує дату останнього git-коміту для кожної сторінки/картки
      # окремо і зберігає у src/data/lastmod-map.json. Запускається
      # ЛИШЕ якщо попередній крок завершився успішно (тобто білд
      # пройшов і файли вже перенесені у реальний репозиторій).
      - name: Generate lastmod map for sitemap
        if: success()
        run: node scripts/generate-lastmod-map.js

      # Комітимо та пушимо ЛИШЕ якщо process-update.js завершився
      # успішно. Якщо він впав (білд не пройшов) — реальний
      # репозиторій і так лишився недоторканим, коміт не потрібен.
      - name: Commit and Push changes
        if: success()
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "Изменений нет."
          else
            git commit -m "🤖 Авто-обновление сайта"
            git push origin ${{ github.ref_name }}
          fi
